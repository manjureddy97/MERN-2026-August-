<svg width="680" height="660" viewBox="0 0 680 660" xmlns="http://www.w3.org/2000/svg" role="img">
<title>MERN stack architecture</title>
<desc>Browser with React talks over HTTP to a Node.js and Express backend, which reads and writes to MongoDB or a SQL database.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="660" fill="#ffffff"/>

<!-- Browser (frontend) -->
<rect x="60" y="50" width="260" height="240" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="190" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0C447C">Browser</text>
<text x="190" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#185FA5">What users see</text>

<rect x="90" y="160" width="200" height="110" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="190" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#04342C">React</text>
<text x="190" y="213" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#085041">UI components</text>
<text x="190" y="229" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#085041">+ TypeScript</text>

<!-- Node + Express (backend) -->
<rect x="380" y="110" width="260" height="290" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="510" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#26215C">Node.js + Express</text>
<text x="510" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3C3489">Server / backend</text>

<rect x="410" y="190" width="200" height="70" rx="10" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
<text x="510" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#412402">Express.js</text>
<text x="510" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#633806">API routes + logic</text>

<rect x="410" y="280" width="200" height="40" rx="20" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="510" y="304" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0C447C">TypeScript (type safety)</text>

<!-- Connector: browser to backend -->
<line x1="320" y1="170" x2="378" y2="250" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="345" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">HTTP</text>
<text x="345" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">JSON</text>

<!-- MongoDB -->
<rect x="110" y="470" width="230" height="110" rx="14" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="225" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#04342C">MongoDB</text>
<text x="225" y="520" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#085041">NoSQL database</text>
<text x="225" y="536" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#085041">Stores JSON-like docs</text>

<!-- SQL -->
<rect x="380" y="470" width="230" height="110" rx="14" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<text x="495" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#26215C">SQL database</text>
<text x="495" y="520" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3C3489">MySQL / PostgreSQL</text>
<text x="495" y="536" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3C3489">Structured tables</text>

<!-- Connectors: backend to databases -->
<line x1="500" y1="400" x2="240" y2="468" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="510" y1="400" x2="495" y2="468" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Legend -->
<rect x="60" y="612" width="12" height="12" rx="3" fill="#1D9E75"/>
<text x="78" y="622" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2C2C2A">Frontend</text>
<rect x="170" y="612" width="12" height="12" rx="3" fill="#7F77DD"/>
<text x="188" y="622" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2C2C2A">Backend</text>
<rect x="270" y="612" width="12" height="12" rx="3" fill="#5DCAA5"/>
<text x="288" y="622" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2C2C2A">MongoDB</text>
<rect x="380" y="612" width="12" height="12" rx="3" fill="#AFA9EC"/>
<text x="398" y="622" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2C2C2A">SQL</text>
<rect x="450" y="612" width="12" height="12" rx="3" fill="#85B7EB"/>
<text x="468" y="622" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2C2C2A">TypeScript</text>
</svg>
