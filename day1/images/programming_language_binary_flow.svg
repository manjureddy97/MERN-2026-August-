<svg width="680" height="540" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Why we need programming languages, down to binary</title>
<desc>Code you write is translated step by step into binary and then into electrical switches the computer runs.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="680" height="540" fill="#ffffff"/>

<rect x="190" y="40" width="300" height="56" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#04342C">You write code</text>
<text x="340" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#085041">e.g. JavaScript, Python</text>
<line x1="340" y1="96" x2="340" y2="130" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="190" y="130" width="300" height="56" rx="10" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
<text x="340" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#412402">Compiler / interpreter</text>
<text x="340" y="168" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#633806">Translates your code</text>
<line x1="340" y1="186" x2="340" y2="220" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="190" y="220" width="300" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#26215C">Machine code</text>
<text x="340" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3C3489">Binary: 0s and 1s</text>

<text x="340" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">Letter "A" = 01000001</text>
<circle cx="235" cy="318" r="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<circle cx="265" cy="318" r="8" fill="#378ADD"/>
<circle cx="295" cy="318" r="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<circle cx="325" cy="318" r="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<circle cx="355" cy="318" r="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<circle cx="385" cy="318" r="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<circle cx="415" cy="318" r="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<circle cx="445" cy="318" r="8" fill="#378ADD"/>

<line x1="340" y1="332" x2="340" y2="366" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="190" y="366" width="300" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="340" y="386" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0C447C">Electrical signals</text>
<text x="340" y="404" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#185FA5">Switches turn on or off</text>
<line x1="340" y1="422" x2="340" y2="456" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="190" y="456" width="300" height="44" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="340" y="480" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#173404">Computer runs the task</text>
</svg>
