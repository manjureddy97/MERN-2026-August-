<svg width="680" height="280" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>MERN acronym breakdown</title>
<desc>M is MongoDB, E is Express, R is React, N is Node.js, and together React talks to Express and Node which talk to MongoDB.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="680" height="280" fill="#ffffff"/>

<rect x="50" y="40" width="130" height="56" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="115" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#04342C">M – MongoDB</text>
<text x="115" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#085041">Database</text>

<rect x="200" y="40" width="130" height="56" rx="10" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
<text x="265" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#412402">E – Express</text>
<text x="265" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#633806">Backend framework</text>

<rect x="350" y="40" width="130" height="56" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="415" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#04342C">R – React</text>
<text x="415" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#085041">Frontend library</text>

<rect x="500" y="40" width="130" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="565" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">N – Node.js</text>
<text x="565" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3C3489">Backend runtime</text>

<rect x="30" y="140" width="180" height="64" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="120" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#04342C">React</text>
<text x="120" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#085041">(R) frontend</text>
<line x1="210" y1="172" x2="248" y2="172" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="250" y="140" width="180" height="64" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#26215C">Express + Node.js</text>
<text x="340" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3C3489">(E + N) backend</text>
<line x1="430" y1="172" x2="468" y2="172" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="470" y="140" width="180" height="64" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="560" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#04342C">MongoDB</text>
<text x="560" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#085041">(M) database</text>

<text x="340" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">Together these 4 pieces build one full application</text>
</svg>
