<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>TypeScript's role across frontend and backend</title>
<desc>TypeScript sits underneath both React on the frontend and Node.js/Express on the backend, adding type safety to both, so mistakes get caught while typing instead of only when the app runs.</desc>
<rect width="900" height="420" fill="#ffffff"/>

<rect x="80" y="40" width="300" height="70" rx="12" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
<text x="230" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#04342C">React</text>
<text x="230" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#085041">Frontend</text>

<rect x="520" y="40" width="300" height="70" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="670" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#26215C">Node.js + Express</text>
<text x="670" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3C3489">Backend</text>

<line x1="230" y1="110" x2="230" y2="160" stroke="#9C9B94" stroke-width="1"/>
<line x1="670" y1="110" x2="670" y2="160" stroke="#9C9B94" stroke-width="1"/>

<rect x="80" y="160" width="740" height="70" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="450" y="192" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0C447C">TypeScript</text>
<text x="450" y="214" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#185FA5">Adds type safety to both sides</text>

<text x="450" y="268" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444441">Without it, a small mistake only shows up after the app runs:</text>

<rect x="130" y="285" width="290" height="100" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="275" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2C2C2A">Without TypeScript</text>
<text x="275" y="342" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444441">Bug only shows up</text>
<text x="275" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444441">when the app runs ❌</text>

<rect x="480" y="285" width="290" height="100" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="625" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#173404">With TypeScript</text>
<text x="625" y="342" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2C4A0A">Bug caught while</text>
<text x="625" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2C4A0A">you're typing ✅</text>
</svg>
